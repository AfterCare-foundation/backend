[project]
name = "aftercare-backend"
version = "0.1.0"
description = "AfterCare backend: anonymous STI exposure notification"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework
    "fastapi==0.142.2",
    "uvicorn[standard]==0.30.6",
    # Database: async PostgreSQL driver
    "asyncpg==0.29.0",
    # Config: reads settings from .env
    "pydantic-settings==2.4.0",
    # HTTP client used to call APNs and FCM; h2 gives HTTP/2, required by APNs
    "httpx==0.27.2",
    "h2==4.4.1",
    # APNs authentication: Apple requires a signed JWT
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    # FCM authentication: Google requires an OAuth2 token from a service account
    "google-auth==2.35.0",
    "requests==2.34.2",  # google-auth's transport layer
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false  # an app, not a library: nothing to build or install
